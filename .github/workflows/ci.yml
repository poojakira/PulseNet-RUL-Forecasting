name: PulseNet Archive CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Ruff
        run: pip install ruff==0.11.8
      - name: Run Ruff Linter
        run: ruff check src tests scripts verify.py
      - name: Run Ruff Formatter
        run: ruff format --check src tests scripts verify.py

  test:
    name: Tests and Coverage Report
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx skops
      - name: Run Tests with Coverage Report
        run: |
          PYTHONPATH=src pytest tests -q \
            --cov=src/pulsenet \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml
      - name: Official NASA Data Verification
        run: PYTHONPATH=src python verify.py
      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: coverage-report
          path: coverage.xml

  security:
    name: Archived Dependency and SAST Advisory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit==1.8.3 pip-audit==2.10.1
      - name: Bandit SAST
        run: bandit -r src/ -ll
      - name: pip-audit advisory for archived dependencies
        run: |
          pip-audit -r requirements.txt --skip-editable || true
          echo "PulseNet is archived and not production-ready; dependency findings are advisory until the archive is actively maintained again."

  typecheck:
    name: Archived Type Check Advisory
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyright
      - name: Run Pyright advisory
        run: |
          PYTHONPATH=src pyright src/ || true
          echo "PulseNet is archived and not production-ready; broad type debt is reported but not used as a release gate."