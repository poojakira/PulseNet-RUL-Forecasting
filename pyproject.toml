[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PulseNet-RUL-Forecasting"
version = "1.0.0"
description = "RUL forecasting with ICS ATT&CK v19 detection for industrial ML pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "attack-v19-core @ git+https://github.com/poojakira/attack-v19-core.git",
    "mitreattack-python==3.0.3",
    "stix2==3.0.1",
    "pydantic==2.7.4",
    "fastapi==0.140.0",
    "uvicorn[standard]==0.29.0",
    "torch==2.3.0",
    "torchvision==0.18.0",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scikit-learn==1.5.0",
    "scipy==1.13.0",
    "mlflow==2.14.1",
    "prometheus-client==0.19.0",
    "psutil==5.9.8",
    "redis==5.0.3",
    "aiokafka==0.8.1",
    "confluent-kafka==2.3.0",
    "onnxruntime==1.18.0",
    "transformers==4.40.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.1.2",
    "python-multipart==0.0.6",
    "cryptography==42.0.2",
    "pyyaml==6.0.1",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.1",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.4",
    "mypy>=1.10.0",
    "bandit>=1.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --strict-config --cov=pulsenet --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=80 -W error::DeprecationWarning -W error::PendingDeprecationWarning"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]
select = ["E", "F", "I", "N", "W", "B", "UP", "S"]
ignore = ["S101", "N803", "N806", "B007", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["pulsenet"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true